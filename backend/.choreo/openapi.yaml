openapi: 3.0.3
info:
  title: Choreo AI Assistant API
  description: |
    RAG-based AI Assistant for Choreo documentation and architecture queries.
    
    This API provides intelligent question-answering capabilities using:
    - Azure OpenAI for language processing
    - Milvus vector database for context retrieval
    - LangChain/LangGraph for orchestration
    
    Features:
    - Natural language Q&A about Choreo
    - Context-aware responses using RAG (Retrieval Augmented Generation)
    - GitHub repository ingestion
    - Organization-wide documentation ingestion
    - Image and diagram processing (with Google Vision)
  version: 1.0.0
  contact:
    name: Choreo AI Assistant Support
    email: support@choreo.dev
  x-choreo-version: v1.0

servers:
  - url: https://bfdef01f-7fc1-46ea-af69-42279e15f710-dev.e1-us-east-azure.choreoapis.dev/choreo-ai-assistant/backend-yn/v1.0
    description: Choreo Development Environment
  - url: https://your-component-url.choreoapis.dev/choreo-ai-assistant/backend-yn/v1.0
    description: Choreo Production Environment
  - url: http://localhost:9090
    description: Local Development Environment

tags:
  - name: Health
    description: Health check and status endpoints
  - name: Query
    description: AI-powered question answering endpoints
  - name: Ingestion
    description: Data ingestion and indexing endpoints
  - name: Webhooks
    description: GitHub webhook integration

paths:
  /:
    get:
      operationId: getRootStatus
      summary: Root endpoint
      description: Returns a welcome message and API status
      tags:
        - Health
      responses:
        '200':
          description: API is running
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Choreo AI Assistant (Azure LLM + Milvus) is running."
                  status:
                    type: string
                    example: "ok"
    post:
      operationId: handleRootPost
      summary: Root POST endpoint
      description: Handles POST requests to root - often from webhooks or health checks
      tags:
        - Health
      requestBody:
        description: Optional JSON payload
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: POST received
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "POST received at root endpoint"
                  hint:
                    type: string
                    example: "Use /api/webhook/github for GitHub webhooks or /api/ask for AI queries"
                  received:
                    type: object
                    description: Echo of received payload (if any)

  /health:
    get:
      operationId: getHealthSimplified
      summary: Health check (simplified)
      description: Simplified health check showing Milvus connectivity status (used by Choreo deployment)
      tags:
        - Health
      responses:
        '200':
          description: Health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [healthy, unhealthy]
                    description: Overall API health status
                  milvus:
                    type: string
                    enum: [connected, disconnected]
                    description: Milvus vector database connection status
              examples:
                healthy:
                  value:
                    status: healthy
                    milvus: connected
                unhealthy:
                  value:
                    status: unhealthy
                    milvus: disconnected

  /api/health:
    get:
      operationId: getHealthDetailed
      summary: Health check
      description: Check API health and Milvus vector database connectivity
      tags:
        - Health
      responses:
        '200':
          description: Health status with Milvus connection status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  value:
                    status: healthy
                    components:
                      milvus:
                        status: healthy
                        message: Milvus connected
                        details: {}
                      application:
                        status: healthy
                        message: Application running
                        details: {}
                    timestamp: "2024-12-19T10:30:00.000000"
                unhealthy:
                  value:
                    status: unhealthy
                    components:
                      milvus:
                        status: unhealthy
                        message: Milvus disconnected
                        details: {}
                      application:
                        status: healthy
                        message: Application running
                        details: {}
                    timestamp: "2024-12-19T10:30:00.000000"

  /metrics:
    get:
      operationId: getPrometheusMetrics
      summary: Prometheus metrics
      description: |
        Returns metrics in Prometheus format for monitoring and observability.
        
        Includes metrics for:
        - HTTP request counts and latency
        - AI inference performance
        - Vector search performance
        - Error rates and counts
      tags:
        - Health
      responses:
        '200':
          description: Prometheus metrics in text format
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP http_requests_total Total HTTP requests
                  # TYPE http_requests_total counter
                  http_requests_total{method="POST",endpoint="/api/ask"} 42
                  # HELP ai_inference_duration_seconds AI inference duration
                  # TYPE ai_inference_duration_seconds histogram
                  ai_inference_duration_seconds_bucket{le="1.0"} 35

  /api/ask:
    post:
      operationId: askQuestion
      summary: Ask a question (standard RAG)
      description: |
        Ask a question about Choreo using standard RAG (Retrieval Augmented Generation).
        
        This endpoint:
        1. Manages conversation memory with smart summarization
        2. Enriches query with conversation context
        3. Retrieves relevant context from Milvus vector database
        4. Sends context + question to Azure OpenAI
        5. Validates URLs in response
        6. Returns AI-generated answer with sources and metadata
        
        Features:
        - Conversation history support
        - Automatic summarization of long conversations
        - URL validation for reliable sources
        - Source document references with relevance scores
      tags:
        - Query
      requestBody:
        description: Question and conversation context
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              simple_question:
                summary: Simple question without history
                value:
                  question: "What is Choreo?"
              with_history:
                summary: Question with conversation history
                value:
                  question: "How do I deploy it?"
                  conversation_history:
                    - role: "user"
                      content: "What is Choreo?"
                    - role: "assistant"
                      content: "Choreo is an internal developer platform..."
      responses:
        '200':
          description: Successful response with answer, sources, and metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponseDetailed'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /ask:
    post:
      operationId: askQuestionLegacy
      summary: Ask a question (legacy endpoint)
      description: Legacy endpoint for asking questions. Use /api/ask instead.
      deprecated: true
      tags:
        - Query
      parameters:
        - name: question
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'

  /api/ask/stream:
    post:
      operationId: askQuestionStream
      summary: Ask a question with streaming response
      description: |
        Stream AI response progressively like ChatGPT with conversation history and smart summarization.
        
        This endpoint:
        1. Manages conversation memory with smart summarization
        2. Retrieves relevant context from Milvus vector database
        3. Streams response from Azure OpenAI word by word
        4. Validates URLs in complete response before streaming
        5. Returns sources and metadata at the end of stream
        
        Features:
        - Progressive streaming for better user experience
        - Conversation history support
        - Automatic summarization
        - URL validation
        - Server-Sent Events (SSE) format
      tags:
        - Query
      requestBody:
        description: Question and conversation context
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
            examples:
              simple_question:
                summary: Simple streaming question
                value:
                  question: "What is Choreo?"
              with_history:
                summary: Streaming with conversation history
                value:
                  question: "How do I deploy it?"
                  conversation_history:
                    - role: "user"
                      content: "What is Choreo?"
                    - role: "assistant"
                      content: "Choreo is an internal developer platform..."
      responses:
        '200':
          description: Streaming response in Server-Sent Events format
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Stream of Server-Sent Events. Each event contains either:
                  - Content chunk: {"content": "word "}
                  - Metadata (sent at end): {"sources": [...], "memory_stats": {...}, "url_validation": {...}}
                  - Done signal: [DONE]
              example: |
                data: {"content": "Choreo "}
                
                data: {"content": "is "}
                
                data: {"content": "a "}
                
                data: {"sources": [...], "memory_stats": {...}}
                
                data: [DONE]
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                type: object
                properties:
                  detail:
                    type: string

  /api/ask_graph:
    post:
      operationId: askQuestionGraph
      summary: Ask a question (LangGraph RAG)
      description: |
        Ask a question using LangGraph-based RAG for more sophisticated query processing.
        
        This endpoint uses LangGraph for:
        - Multi-step reasoning
        - Advanced context retrieval
        - Graph-based query processing
      tags:
        - Query
      parameters:
        - name: question
          in: query
          required: true
          description: The question to ask about Choreo
          schema:
            type: string
            example: "How do I deploy a microservice in Choreo?"
      responses:
        '200':
          description: Successful response with answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'

  /ask_graph:
    post:
      operationId: askQuestionGraphLegacy
      summary: Ask a question with LangGraph (legacy endpoint)
      description: Legacy endpoint. Use /api/ask_graph instead.
      deprecated: true
      tags:
        - Query
      parameters:
        - name: question
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'

  /api/ingest/github:
    post:
      operationId: ingestGitHubRepository
      summary: Ingest GitHub repository
      description: |
        Ingest markdown documentation from a GitHub repository into the vector database.
        
        Process:
        1. Clones the repository
        2. Finds all .md files
        3. Chunks the content
        4. Generates embeddings
        5. Stores in Milvus
      tags:
        - Ingestion
      parameters:
        - name: repo_url
          in: query
          required: false
          description: GitHub repository URL
          schema:
            type: string
            default: "https://github.com/wso2/docs-choreo-dev.git"
            example: "https://github.com/wso2/docs-choreo-dev.git"
        - name: branch
          in: query
          required: false
          description: Branch name to ingest
          schema:
            type: string
            default: "main"
            example: "main"
      responses:
        '200':
          description: Ingestion completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'

  /ingest/github:
    post:
      operationId: ingestGitHubRepositoryLegacy
      summary: Ingest GitHub repository (legacy endpoint)
      description: Legacy endpoint. Use /api/ingest/github instead.
      deprecated: true
      tags:
        - Ingestion
      parameters:
        - name: repo_url
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Ingestion completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'

  /api/ingest/github/with-images:
    post:
      operationId: ingestGitHubRepositoryWithImages
      summary: Ingest GitHub repository with images
      description: |
        Ingest both markdown files and images from a GitHub repository.
        
        Requires Google Vision API configuration.
        
        Process:
        1. Ingests markdown files (same as /api/ingest/github)
        2. Processes images with Google Vision OCR
        3. Extracts text from diagrams and screenshots
        4. Indexes image content alongside markdown
      tags:
        - Ingestion
      parameters:
        - name: repo_url
          in: query
          required: false
          description: GitHub repository URL
          schema:
            type: string
            default: "https://github.com/wso2/docs-choreo-dev.git"
        - name: branch
          in: query
          required: false
          description: Branch name to ingest
          schema:
            type: string
            default: "main"
      responses:
        '200':
          description: Ingestion completed with images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionResponse'
        '500':
          description: Google Vision API not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Google Vision API is not configured. Please add GOOGLE_VISION_API_KEY to your .env file."

  /api/ingest/org:
    post:
      operationId: ingestOrganizationRepositories
      summary: Ingest organization repositories
      description: |
        Bulk ingest markdown files from all repositories in a GitHub organization.
        
        Features:
        - Filter repositories by keyword
        - Limit number of repositories to process
        - Batch processing with progress tracking
        - Incremental updates (skips already processed files)
      tags:
        - Ingestion
      parameters:
        - name: org
          in: query
          required: true
          description: GitHub organization name
          schema:
            type: string
            example: "wso2-enterprise"
        - name: keyword
          in: query
          required: false
          description: Keyword to filter repositories (e.g., 'choreo')
          schema:
            type: string
            default: ""
            example: "choreo"
        - name: max_repos
          in: query
          required: false
          description: Maximum number of repositories to process
          schema:
            type: integer
            minimum: 1
            example: 10
      responses:
        '200':
          description: Bulk ingestion completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkIngestionResponse'
              examples:
                success:
                  value:
                    status: "completed"
                    total_repos: 15
                    processed_repos: 15
                    total_files: 234
                    total_chunks: 1567
                    total_embeddings: 1567
                    duration_seconds: 180

  /api/webhook/github:
    post:
      operationId: handleGitHubWebhook
      summary: GitHub webhook handler
      description: |
        Handles GitHub webhooks to automatically re-ingest repositories on push events.
        
        When a push event is received:
        1. Extracts repository URL and branch from payload
        2. Triggers automatic re-ingestion
        3. Updates the vector database with latest content
      tags:
        - Webhooks
      requestBody:
        description: GitHub webhook payload
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                repository:
                  type: object
                  properties:
                    html_url:
                      type: string
                      example: "https://github.com/wso2/docs-choreo-dev"
                ref:
                  type: string
                  example: "refs/heads/main"
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error, ignored]
                  ingested:
                    type: object
                  message:
                    type: string

  /webhook/github:
    post:
      operationId: handleGitHubWebhookLegacy
      summary: GitHub webhook handler (legacy endpoint)
      description: Legacy endpoint. Use /api/webhook/github instead.
      deprecated: true
      tags:
        - Webhooks
      requestBody:
        description: GitHub webhook payload
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok, error, ignored]

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [healthy, unhealthy]
          description: Overall API health status
        components:
          type: object
          description: Health status of individual components
          properties:
            milvus:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                message:
                  type: string
                details:
                  type: object
            application:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                message:
                  type: string
                details:
                  type: object
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the health check

    AskResponse:
      type: object
      properties:
        answer:
          type: string
          description: AI-generated answer to the question
          example: "Choreo is an internal developer platform that enables developers to build, deploy, and manage cloud-native applications."
        context_count:
          type: integer
          description: Number of context chunks used to generate the answer
          example: 5

    AskRequest:
      type: object
      required:
        - question
      properties:
        question:
          type: string
          description: The question to ask about Choreo
          example: "What is Choreo?"
        conversation_history:
          type: array
          description: Previous conversation messages for context
          items:
            type: object
            properties:
              role:
                type: string
                enum: [user, assistant]
                description: Role of the message sender
              content:
                type: string
                description: Message content
          example:
            - role: "user"
              content: "What is Choreo?"
            - role: "assistant"
              content: "Choreo is an internal developer platform..."
        summary:
          type: object
          description: Conversation summary from previous interactions
          properties:
            content:
              type: string
              description: Summary text
            topics_covered:
              type: array
              items:
                type: string
              description: Topics discussed in the conversation
            key_questions:
              type: array
              items:
                type: string
              description: Key questions from the conversation
            important_decisions:
              type: array
              items:
                type: string
              description: Important decisions or conclusions
        max_history_tokens:
          type: integer
          description: Configurable token limit for conversation history
          default: 4000
          example: 4000
        enable_summarization:
          type: boolean
          description: Enable/disable auto-summarization
          default: true
          example: true

    AskResponseDetailed:
      type: object
      properties:
        answer:
          type: string
          description: AI-generated answer to the question
          example: "Choreo is an internal developer platform that enables developers to build, deploy, and manage cloud-native applications."
        sources:
          type: array
          description: Source documents used to generate the answer
          items:
            type: object
            properties:
              content:
                type: string
                description: Preview of the source content
              score:
                type: number
                format: float
                description: Relevance score (0.0 to 1.0)
                example: 0.85
              repository:
                type: string
                description: GitHub repository name
                example: "wso2-enterprise/choreo-docs"
              file_path:
                type: string
                description: Path to the file within the repository
                example: "docs/overview.md"
              url:
                type: string
                description: URL to the source document
                example: "https://github.com/wso2-enterprise/choreo-docs"
              source_type:
                type: string
                description: Type of source (e.g., markdown, wiki, issue)
                example: "markdown"
              title:
                type: string
                description: Title of the source document
                example: "Choreo Overview"
        context_count:
          type: integer
          description: Number of context chunks retrieved
          example: 10
        url_validation:
          type: object
          description: URL validation results
          properties:
            total_urls:
              type: integer
              description: Total number of URLs validated
              example: 3
            valid_urls:
              type: integer
              description: Number of valid URLs
              example: 3
            invalid_urls:
              type: integer
              description: Number of invalid URLs
              example: 0
            validation_enabled:
              type: boolean
              description: Whether URL validation is enabled
              example: true
        memory_stats:
          type: object
          description: Conversation memory management statistics
          properties:
            original_history_size:
              type: integer
              description: Original number of messages in history
              example: 10
            summarized_messages:
              type: integer
              description: Number of messages that were summarized
              example: 6
            recent_messages_kept:
              type: integer
              description: Number of recent messages kept verbatim
              example: 4
            total_tokens_estimate:
              type: integer
              description: Estimated total tokens after memory management
              example: 3500
        summary:
          type: object
          description: Updated conversation summary
          properties:
            content:
              type: string
              description: Summary content
            topics_covered:
              type: array
              items:
                type: string
              description: Topics covered in the conversation
            key_questions:
              type: array
              items:
                type: string
              description: Key questions asked
            important_decisions:
              type: array
              items:
                type: string
              description: Important decisions or conclusions
        summary_metadata:
          type: object
          description: Additional metadata about the summary
          properties:
            topics_covered:
              type: array
              items:
                type: string
            key_questions:
              type: array
              items:
                type: string
            important_decisions:
              type: array
              items:
                type: string

    IngestionResponse:
      type: object
      properties:
        repo_url:
          type: string
          description: GitHub repository URL that was ingested
        branch:
          type: string
          description: Branch name that was ingested
        status:
          type: string
          description: Ingestion status
          example: "completed"
        files_processed:
          type: integer
          description: Number of files processed
          example: 42
        chunks_created:
          type: integer
          description: Number of text chunks created
          example: 315
        embeddings_stored:
          type: integer
          description: Number of embeddings stored in vector database
          example: 315

    BulkIngestionResponse:
      type: object
      properties:
        status:
          type: string
          description: Overall ingestion status
          example: "completed"
        total_repos:
          type: integer
          description: Total number of repositories found
          example: 15
        processed_repos:
          type: integer
          description: Number of repositories successfully processed
          example: 15
        total_files:
          type: integer
          description: Total markdown files processed across all repositories
          example: 234
        total_chunks:
          type: integer
          description: Total text chunks created
          example: 1567
        total_embeddings:
          type: integer
          description: Total embeddings stored
          example: 1567
        duration_seconds:
          type: number
          format: float
          description: Total processing time in seconds
          example: 180.5

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Optional API key for rate limiting and access control

# Apply security globally (optional)
# security:
#   - ApiKeyAuth: []

