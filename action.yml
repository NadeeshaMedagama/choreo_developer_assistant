name: 'Choreo AI Assistant'
description: >
  Choreo Developer Assistant with Milvus vector database
author: 'DevChoreo'

branding:
  icon: 'message-circle'
  color: 'blue'

inputs:
  # ============================================
  # Required Inputs
  # ============================================
  azure-openai-api-key:
    description: 'Azure OpenAI API key for LLM inference'
    required: true

  azure-openai-endpoint:
    description: 'Azure OpenAI endpoint URL (e.g., https://<resource>.openai.azure.com/)'
    required: true

  azure-openai-deployment:
    description: 'Azure OpenAI deployment/model name'
    required: true

  # ============================================
  # Repository Configuration
  # ============================================
  github-token:
    description: 'GitHub token for accessing repository content'
    required: false
    default: ${{ github.token }}

  repository:
    description: 'Target GitHub repository to ingest (owner/repo format). Defaults to current repository.'
    required: false
    default: ${{ github.repository }}

  repository-ref:
    description: 'Git ref (branch, tag, or SHA) of the repository to ingest'
    required: false
    default: 'main'

  # ============================================
  # Vector Database Configuration
  # ============================================
  milvus-host:
    description: 'Milvus vector database host'
    required: false
    default: 'localhost'

  milvus-port:
    description: 'Milvus vector database port'
    required: false
    default: '19530'

  milvus-collection:
    description: 'Milvus collection name for storing embeddings'
    required: false
    default: 'choreo_docs'

  # ============================================
  # Assistant Configuration
  # ============================================
  question:
    description: 'Question to ask the AI assistant'
    required: false
    default: ''

  enable-streaming:
    description: 'Enable progressive streaming responses'
    required: false
    default: 'true'

  enable-summarization:
    description: 'Enable conversation memory with smart summarization'
    required: false
    default: 'true'

  enable-diagram-generation:
    description: 'Enable Mermaid diagram generation in responses'
    required: false
    default: 'true'

  enable-url-validation:
    description: 'Enable automatic URL validation in responses'
    required: false
    default: 'true'

  # ============================================
  # Server Configuration
  # ============================================
  backend-port:
    description: 'Port for the backend API server'
    required: false
    default: '8000'

  frontend-port:
    description: 'Port for the frontend UI server'
    required: false
    default: '5173'

  mode:
    description: 'Run mode: "server" starts the full application, "query" asks a single question and exits'
    required: false
    default: 'server'

  # ============================================
  # Advanced Configuration
  # ============================================
  embedding-model:
    description: 'Sentence transformer model for embeddings'
    required: false
    default: 'all-MiniLM-L6-v2'

  max-tokens:
    description: 'Maximum tokens for LLM response'
    required: false
    default: '4096'

  temperature:
    description: 'LLM temperature (0.0 - 1.0)'
    required: false
    default: '0.1'

  log-level:
    description: 'Application log level (DEBUG, INFO, WARNING, ERROR)'
    required: false
    default: 'INFO'

outputs:
  answer:
    description: 'AI-generated answer to the provided question (when mode is "query")'
    value: ${{ steps.run-assistant.outputs.answer }}

  server-url:
    description: 'URL of the running assistant server (when mode is "server")'
    value: ${{ steps.run-assistant.outputs.server-url }}

  status:
    description: 'Status of the action execution (success, failure)'
    value: ${{ steps.run-assistant.outputs.status }}

  ingestion-summary:
    description: 'Summary of the repository ingestion process'
    value: ${{ steps.run-assistant.outputs.ingestion-summary }}

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
        cache-dependency-path: |
          ${{ github.action_path }}/backend/choreo-ai-assistant/requirements.txt
          ${{ github.action_path }}/requirements.txt

    - name: Install backend dependencies
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt
        fi
        if [ -f backend/choreo-ai-assistant/requirements.txt ]; then
          pip install -r backend/choreo-ai-assistant/requirements.txt
        fi

    - name: Configure environment
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        # Create .env file for the backend
        cat > backend/.env << 'ENVEOF'
        AZURE_OPENAI_API_KEY=${{ inputs.azure-openai-api-key }}
        AZURE_OPENAI_ENDPOINT=${{ inputs.azure-openai-endpoint }}
        AZURE_OPENAI_DEPLOYMENT=${{ inputs.azure-openai-deployment }}
        GITHUB_TOKEN=${{ inputs.github-token }}
        TARGET_REPOSITORY=${{ inputs.repository }}
        TARGET_REPOSITORY_REF=${{ inputs.repository-ref }}
        MILVUS_HOST=${{ inputs.milvus-host }}
        MILVUS_PORT=${{ inputs.milvus-port }}
        MILVUS_COLLECTION=${{ inputs.milvus-collection }}
        ENABLE_STREAMING=${{ inputs.enable-streaming }}
        ENABLE_SUMMARIZATION=${{ inputs.enable-summarization }}
        ENABLE_DIAGRAM_GENERATION=${{ inputs.enable-diagram-generation }}
        ENABLE_URL_VALIDATION=${{ inputs.enable-url-validation }}
        EMBEDDING_MODEL=${{ inputs.embedding-model }}
        MAX_TOKENS=${{ inputs.max-tokens }}
        TEMPERATURE=${{ inputs.temperature }}
        LOG_LEVEL=${{ inputs.log-level }}
        PORT=${{ inputs.backend-port }}
        ENVEOF
        
        echo "✅ Environment configured successfully"

    - name: Run Choreo AI Assistant
      id: run-assistant
      shell: bash
      working-directory: ${{ github.action_path }}
      env:
        AZURE_OPENAI_API_KEY: ${{ inputs.azure-openai-api-key }}
        AZURE_OPENAI_ENDPOINT: ${{ inputs.azure-openai-endpoint }}
        AZURE_OPENAI_DEPLOYMENT: ${{ inputs.azure-openai-deployment }}
        PYTHONPATH: ${{ github.action_path }}
        MODE: ${{ inputs.mode }}
        QUESTION: ${{ inputs.question }}
        BACKEND_PORT: ${{ inputs.backend-port }}
      run: |
        set -e

        if [ "$MODE" == "query" ] && [ -n "$QUESTION" ]; then
          echo "🤖 Running in query mode..."
          echo "📝 Question: $QUESTION"
          
          # Start backend server in background
          cd backend
          python start.py &
          SERVER_PID=$!
          
          # Wait for server to be ready
          echo "⏳ Waiting for server to start..."
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${BACKEND_PORT}/" > /dev/null 2>&1; then
              echo "✅ Server is ready!"
              break
            fi
            if [ $i -eq 30 ]; then
              echo "❌ Server failed to start within 30 seconds"
              echo "status=failure" >> $GITHUB_OUTPUT
              kill $SERVER_PID 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done
          
          # Send question to the API
          RESPONSE=$(curl -sf -X POST "http://localhost:${BACKEND_PORT}/api/ask" \
            -H "Content-Type: application/json" \
            -d "{\"question\": \"$QUESTION\", \"enable_summarization\": true}" 2>&1) || {
            echo "❌ Failed to get response from API"
            echo "status=failure" >> $GITHUB_OUTPUT
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          }

          # Extract answer from response
          ANSWER=$(echo "$RESPONSE" | python -c "import sys, json; print(json.load(sys.stdin).get('answer', 'No answer received'))" 2>/dev/null || echo "$RESPONSE")
          
          # Set output (handle multiline)
          {
            echo "answer<<ANSWER_EOF"
            echo "$ANSWER"
            echo "ANSWER_EOF"
          } >> $GITHUB_OUTPUT
          
          echo "status=success" >> $GITHUB_OUTPUT
          
          # Print the answer
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "🤖 Answer:"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "$ANSWER"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          
        elif [ "$MODE" == "server" ]; then
          echo "🚀 Starting Choreo AI Assistant server..."
          echo "server-url=http://localhost:${BACKEND_PORT}" >> $GITHUB_OUTPUT
          echo "status=success" >> $GITHUB_OUTPUT
          
          cd backend
          python start.py &
          
          # Wait for server to be ready
          for i in $(seq 1 30); do
            if curl -sf "http://localhost:${BACKEND_PORT}/" > /dev/null 2>&1; then
              echo "✅ Server is running at http://localhost:${BACKEND_PORT}"
              break
            fi
            sleep 1
          done
          
        else
          echo "ℹ️  No mode specified or no question provided."
          echo "Set 'mode: query' with a 'question' input, or 'mode: server' to start the full application."
          echo "status=success" >> $GITHUB_OUTPUT
        fi


