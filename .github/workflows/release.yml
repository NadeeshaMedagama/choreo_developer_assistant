name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  # ============================================
  # Validate action.yml for Marketplace
  # ============================================
  validate-action:
    name: Validate GitHub Action Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate action.yml exists
        run: |
          if [ ! -f "action.yml" ]; then
            echo "❌ action.yml not found in repository root!"
            echo "This file is required for GitHub Marketplace publishing."
            exit 1
          fi
          echo "✅ action.yml found"

      - name: Validate action.yml structure
        run: |
          python3 -c "
          import yaml, sys

          with open('action.yml', 'r') as f:
              action = yaml.safe_load(f)

          required_fields = ['name', 'description', 'inputs', 'runs']
          marketplace_fields = ['branding']
          
          errors = []
          warnings = []

          for field in required_fields:
              if field not in action:
                  errors.append(f'Missing required field: {field}')

          for field in marketplace_fields:
              if field not in action:
                  warnings.append(f'Missing recommended field for Marketplace: {field}')

          # Validate branding for Marketplace
          if 'branding' in action:
              branding = action['branding']
              if 'icon' not in branding:
                  errors.append('branding.icon is required for Marketplace')
              if 'color' not in branding:
                  errors.append('branding.color is required for Marketplace')
              
              valid_colors = ['white', 'yellow', 'blue', 'green', 'orange', 'red', 'purple', 'gray-dark']
              if branding.get('color') not in valid_colors:
                  errors.append(f'branding.color must be one of: {valid_colors}')

          # Validate runs configuration
          if 'runs' in action:
              runs = action['runs']
              if 'using' not in runs:
                  errors.append('runs.using is required')
              elif runs['using'] not in ['composite', 'node12', 'node16', 'node20', 'docker']:
                  errors.append(f'runs.using value \"{runs[\"using\"]}\" is not valid')

          # Validate description length (max 125 chars for Marketplace listing)
          desc = action.get('description', '')
          if len(desc) > 500:
              warnings.append(f'Description is {len(desc)} chars. Consider keeping it concise.')

          if errors:
              print('❌ Validation FAILED:')
              for e in errors:
                  print(f'  - {e}')
              sys.exit(1)

          if warnings:
              print('⚠️  Warnings:')
              for w in warnings:
                  print(f'  - {w}')

          print('✅ action.yml validation passed!')
          print(f'   Name: {action[\"name\"]}')
          print(f'   Inputs: {len(action.get(\"inputs\", {}))} defined')
          print(f'   Outputs: {len(action.get(\"outputs\", {}))} defined')
          "

  # ============================================
  # Create Release
  # ============================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: validate-action
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        timeout-minutes: 10
        with:
          fetch-depth: 0
        env:
          GIT_TERMINAL_PROMPT: 0

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          echo "## 🚀 What's Changed" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          
          # Get commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            git log --pretty=format:"- %s (%h)" >> CHANGELOG.md
          else
            git log ${LAST_TAG}..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
          fi
          
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${{ steps.get_version.outputs.version }}" >> CHANGELOG.md
          
          cat CHANGELOG.md

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Free up disk space
        run: |
          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Build Python package
        working-directory: ./backend
        run: |
          # Install build tools only
          pip install --no-cache-dir build wheel setuptools
          
          # Create a minimal setup.py using heredoc
          VERSION="${{ steps.get_version.outputs.version_number }}"
          cat << EOF > setup.py
          from setuptools import setup, find_packages

          setup(
              name="choreo-ai-assistant",
              version="$VERSION",
              packages=find_packages(exclude=["tests*", "docs*", "logs*"]),
              python_requires=">=3.11",
              install_requires=[
                  "fastapi>=0.100.0,<1.0.0",
                  "uvicorn[standard]>=0.25.0",
                  "python-dotenv>=1.0.0",
                  "requests>=2.31.0",
                  "httpx>=0.25.0",
              ],
          )
          EOF
          
          # Build without installing dependencies
          python -m build --no-isolation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Build frontend
        working-directory: ./frontend
        run: |
          npm ci --prefer-offline
          npm run build
          
          # Clean up node_modules to save space
          rm -rf node_modules
          
          # Create tarball
          cd dist
          tar -czf ../../frontend-dist.tar.gz .
          
          # Report disk usage
          df -h

      - name: List build artifacts
        run: |
          echo "=== Backend dist files ==="
          ls -la backend/dist/ || echo "No backend/dist directory"
          echo "=== Frontend dist ==="
          ls -la frontend-dist.tar.gz || echo "No frontend-dist.tar.gz"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          files: |
            backend/dist/*.tar.gz
            backend/dist/*.whl
            frontend-dist.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================
  # Build and Push Docker Images
  # ============================================
  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: create-release
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Free up disk space
        run: |
          # Remove unnecessary packages to free up space
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -a -f
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/choreo-ai-assistant:${{ steps.get_version.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/choreo-ai-assistant:latest
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

  # ============================================
  # Notify Release
  # ============================================
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [validate-action, create-release, docker-release]
    if: always()
    
    steps:
      - name: Release Summary
        run: |
          echo "## 🎉 Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ needs.create-release.outputs.version || github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image:** \`${{ secrets.DOCKER_USERNAME }}/choreo-ai-assistant:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Release Assets:" >> $GITHUB_STEP_SUMMARY
          echo "- Python package (wheel & source)" >> $GITHUB_STEP_SUMMARY
          echo "- Frontend build artifacts" >> $GITHUB_STEP_SUMMARY
          echo "- Docker images (amd64 & arm64)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🏪 GitHub Marketplace:" >> $GITHUB_STEP_SUMMARY
          echo "- Action metadata validated: ✅" >> $GITHUB_STEP_SUMMARY
          echo "- This release is available on the GitHub Marketplace" >> $GITHUB_STEP_SUMMARY
          echo "- Use: \`uses: ${{ github.repository }}@${{ needs.create-release.outputs.version || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

