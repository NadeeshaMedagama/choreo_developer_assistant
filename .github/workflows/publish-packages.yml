name: Publish to GitHub Packages

on:
  # Trigger on release creation
  release:
    types: [published]

  # Trigger on push to main branch with version tags
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'  # Semantic versioning tags (v1.0.0, v2.1.3, etc.)

  # Manual trigger
  workflow_dispatch:
    inputs:
      publish_docker:
        description: 'Publish Docker image to GHCR'
        required: false
        default: true
        type: boolean
      publish_python:
        description: 'Publish Python package'
        required: false
        default: true
        type: boolean
      version_tag:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_PACKAGE_NAME: choreo-ai-assistant

# Permissions required for GitHub Packages
permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  # ============================================
  # Build and Publish Docker Image to GHCR
  # ============================================
  publish-docker:
    name: Publish Docker Image to GitHub Container Registry
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_docker }}

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "🧹 Cleaning up disk space..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo apt-get clean
          docker system prune -a -f
          echo "✅ Disk cleanup complete"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:latest
            network=host

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Set latest tag for main/master branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
            # Semantic versioning from git tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Git short SHA
            type=sha,prefix=sha-
            # Branch name
            type=ref,event=branch
            # Manual version input
            type=raw,value=${{ inputs.version_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.version_tag != 'latest' }}
          labels: |
            org.opencontainers.image.title=Choreo AI Assistant
            org.opencontainers.image.description=AI-powered assistant for WSO2 Choreo platform developers
            org.opencontainers.image.vendor=WSO2
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build-push.outputs.digest }}
          push-to-registry: true

      - name: Output image details
        run: |
          echo "## 🐳 Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "**Digest:** \`${{ steps.build-push.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build and Publish Python Package
  # ============================================
  publish-python:
    name: Publish Python Package to GitHub Packages
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish_python }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine setuptools wheel

      - name: Create setup.py if not exists
        run: |
          if [ ! -f "backend/setup.py" ]; then
            cat > backend/setup.py << 'EOF'
          from setuptools import setup, find_packages
          import os

          # Read version from environment or default
          version = os.environ.get('PACKAGE_VERSION', '0.1.0')

          # Read requirements
          with open('requirements.txt') as f:
              requirements = [line.strip() for line in f if line.strip() and not line.startswith('#')]

          # Read README if exists
          long_description = "Choreo AI Assistant - AI-powered assistant for WSO2 Choreo platform"
          if os.path.exists('../README.md'):
              with open('../README.md', encoding='utf-8') as f:
                  long_description = f.read()

          setup(
              name='choreo-ai-assistant',
              version=version,
              author='WSO2',
              author_email='dev@wso2.com',
              description='AI-powered assistant for WSO2 Choreo platform developers',
              long_description=long_description,
              long_description_content_type='text/markdown',
              url='https://github.com/${{ github.repository }}',
              packages=find_packages(exclude=['tests', 'tests.*']),
              python_requires='>=3.10',
              install_requires=requirements,
              classifiers=[
                  'Development Status :: 4 - Beta',
                  'Intended Audience :: Developers',
                  'License :: OSI Approved :: Apache Software License',
                  'Operating System :: OS Independent',
                  'Programming Language :: Python :: 3',
                  'Programming Language :: Python :: 3.10',
                  'Programming Language :: Python :: 3.11',
                  'Programming Language :: Python :: 3.12',
                  'Topic :: Software Development :: Libraries :: Python Modules',
              ],
              entry_points={
                  'console_scripts': [
                      'choreo-assistant=app:main',
                  ],
              },
          )
          EOF
            echo "✅ Created setup.py"
          else
            echo "✅ setup.py already exists"
          fi

      - name: Extract version from tag or set default
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          elif [[ "${{ inputs.version_tag }}" != "" && "${{ inputs.version_tag }}" != "latest" ]]; then
            VERSION="${{ inputs.version_tag }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.1.0.dev${{ github.run_number }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 Package version: $VERSION"

      - name: Build Python package
        working-directory: backend
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -m build
          echo "📦 Built packages:"
          ls -la dist/

      - name: Publish to GitHub Packages (PyPI)
        working-directory: backend
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          TWINE_REPOSITORY_URL: https://ghcr.io/pypi/${{ github.repository_owner }}
        run: |
          # Configure pip for GitHub Packages
          echo "📤 Publishing to GitHub Packages..."
          
          # Create .pypirc for GitHub Packages
          cat > ~/.pypirc << EOF
          [distutils]
          index-servers = github
          
          [github]
          repository = https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
          username = ${{ github.actor }}
          password = ${{ secrets.GITHUB_TOKEN }}
          EOF
          
          # For GitHub Packages, we upload as a release artifact instead
          echo "✅ Python package built successfully"
          echo "📁 Package files:"
          ls -la dist/

      - name: Upload package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: backend/dist/*
          retention-days: 30

      - name: Create Release Assets
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: |
            backend/dist/*.whl
            backend/dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output package details
        run: |
          echo "## 🐍 Python Package Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** ${{ env.PYTHON_PACKAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Download from GitHub Releases" >> $GITHUB_STEP_SUMMARY
          echo "pip install choreo_ai_assistant-${{ steps.version.outputs.version }}-py3-none-any.whl" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Build Frontend Assets
  # ============================================
  publish-frontend:
    name: Build and Publish Frontend Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
          registry-url: 'https://npm.pkg.github.com'
          scope: '@${{ github.repository_owner }}'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Upload frontend build as artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist/
          retention-days: 30

      - name: Output frontend details
        run: |
          echo "## 🌐 Frontend Built" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Framework:** React + Vite" >> $GITHUB_STEP_SUMMARY
          echo "**Build Output:** frontend/dist/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "Frontend build artifacts are available in the workflow artifacts." >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Summary Job
  # ============================================
  summary:
    name: Publish Summary
    runs-on: ubuntu-latest
    needs: [publish-docker, publish-python, publish-frontend]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "# 📦 GitHub Packages Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Package | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Image | ${{ needs.publish-docker.result == 'success' && '✅ Published' || needs.publish-docker.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Python Package | ${{ needs.publish-python.result == 'success' && '✅ Built' || needs.publish-python.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend | ${{ needs.publish-frontend.result == 'success' && '✅ Built' || needs.publish-frontend.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 🚀 Quick Start" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Docker Image" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Login to GitHub Container Registry" >> $GITHUB_STEP_SUMMARY
          echo "echo \$GITHUB_TOKEN | docker login ghcr.io -u USERNAME --password-stdin" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Pull the image" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Run the container" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 8000:8000 ghcr.io/${{ github.repository }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Share with Team" >> $GITHUB_STEP_SUMMARY
          echo "This package is private to your organization. Team members need:" >> $GITHUB_STEP_SUMMARY
          echo "1. Read access to this repository" >> $GITHUB_STEP_SUMMARY
          echo "2. A GitHub Personal Access Token with \`read:packages\` scope" >> $GITHUB_STEP_SUMMARY

