# +required The configuration file schema version
schemaVersion: 1.2

# +required Choreo component implementation type
# Use 'WebApplication' for static frontend served via nginx
implementation: WebApplication

# +optional Build configuration
build:
  buildType: dockerfile
  dockerfilePath: Dockerfile
  dockerContext: .
  buildArgs:
    - name: BUILDKIT_INLINE_CACHE
      value: "1"

# +optional Resource configuration
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    memory: 256Mi
    cpu: 250m

# +optional Incoming connection details for the component
endpoints:
  - name: choreo-ai-frontend
    displayName: Choreo AI Assistant Frontend
    service:
      basePath: /
      port: 80
    type: WebApplication
    networkVisibilities:
      - Public

# +optional Defines runtime configurations
configurations:
  env:
    # Backend API URL - Set to the full backend invoke URL with version
    - name: API_URL
      valueFrom:
        configForm:
          displayName: Backend API URL
          required: true
          type: string
          default: "https://bfdef01f-7fc1-46ea-af69-42279e15f710-dev.e1-us-east-azure.choreoapis.dev/choreo-ai-assistant/backend-yn/v1.0/"

    # Environment name (development, staging, production)
    - name: ENVIRONMENT
      valueFrom:
        configForm:
          displayName: Environment
          required: false
          type: string
          default: "production"

    # Application version
    - name: VERSION
      valueFrom:
        configForm:
          displayName: Application Version
          required: false
          type: string
          default: "1.0.0"
